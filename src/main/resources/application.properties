# =============================================================================
# StreamX RAG Service Configuration
# =============================================================================

# --- Datasource (PostgreSQL + pgvector) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:raguser}
quarkus.datasource.password=${DB_PASSWORD:ragpass}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/ragdb}

# --- Hibernate ORM (chat_profiles table) ---
# "update" creates the table on first boot and applies non-destructive changes.
# Switch to "validate" once the schema is stable in production.
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# --- OpenAI ---
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:demo}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o
quarkus.langchain4j.openai.chat-model.temperature=0.3
quarkus.langchain4j.openai.embedding-model.model-name=text-embedding-3-small

# --- pgvector Embedding Store ---
quarkus.langchain4j.pgvector.dimension=1536
# Keep index disabled until you have >1000 documents; then set use-index=true
# and tune index-list-size = sqrt(total_vectors), e.g. 100 for 10k docs.
quarkus.langchain4j.pgvector.use-index=false
# quarkus.langchain4j.pgvector.index-list-size=100

# --- AEM Connector ---
rag.aem.base-url=${AEM_URL:http://localhost:4502}
rag.aem.graphql-endpoint=/content/_cq_graphql/global/endpoint.json
# Basic Auth (on-premise AEM). For AEM Cloud use AEM_SERVICE_TOKEN instead.
rag.aem.username=admin
rag.aem.password=admin
# AEM Cloud Service Token (Bearer auth). When set, overrides username/password.
# Generate: AEM → Tools → Security → Adobe IMS → Service Credentials
rag.aem.service-token=${AEM_SERVICE_TOKEN:}
# Root path for AEM Pages crawling
rag.aem.content-root=/content/streamx
# --- Content Fragment model mapping ---
# Change these to match your AEM CF model:
#   AEM auto-generates "${modelName}List" from a model named "${modelName}".
#   Example: model "article" → rag.aem.cf-list-query=articleList
#   Example: model "blogPost" → rag.aem.cf-list-query=blogPostList
rag.aem.cf-list-query=articleList
rag.aem.cf-title-field=title
rag.aem.cf-body-field=body
rag.aem.cf-page-size=200
# HTTP timeouts for AEM requests
rag.aem.http-connect-timeout-seconds=10
rag.aem.http-request-timeout-seconds=30

# --- PIM Connector ---
rag.pim.base-url=${PIM_URL:http://localhost:8090}
rag.pim.api-path=/api/v1/products
rag.pim.api-key=${PIM_API_KEY:}

# --- Admin API key (set ADMIN_API_KEY env var in production) ---
# Default "admin123" is for local demo only. Always set ADMIN_API_KEY in production.
admin.api-key=${ADMIN_API_KEY:admin123}

# --- AEM Push Webhook ---
# Set AEM_WEBHOOK_ENABLED=true to activate POST /api/webhook/aem.
# AEM calls this endpoint on publish (Activate) / unpublish or delete (Deactivate/Delete).
# Auth (one of):
#   1. HMAC secret (recommended): set AEM_WEBHOOK_HMAC_SECRET — AEM must send
#      X-AEM-Signature: sha256=<hex(HMAC-SHA256(secret, body))>
#   2. Admin key fallback: leave secret empty — AEM sends X-Admin-Key: <ADMIN_API_KEY>
rag.webhook.enabled=${AEM_WEBHOOK_ENABLED:false}
rag.webhook.hmac-secret=${AEM_WEBHOOK_HMAC_SECRET:}

# --- Ingestion ---
rag.ingestion.chunk-size=500
rag.ingestion.chunk-overlap=50
rag.ingestion.full-sync-cron=0 0 2 * * ?
rag.ingestion.delta-sync-interval=15m

# --- HTTP binding (port 8081, all interfaces — reachable on LAN and Docker) ---
quarkus.http.host=0.0.0.0
quarkus.http.port=8081

# --- CORS ---
# Dev: allow all origins for easy local testing.
# Production: set CORS_ORIGINS env var to a comma-separated allowlist, e.g.:
#   CORS_ORIGINS=https://shop.example.com,https://aem.example.com
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:/.*/}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,X-Admin-Key,X-AEM-Signature

# --- Kafka (active only with "kafka" profile) ---
%kafka.mp.messaging.incoming.pim-products.connector=smallrye-kafka
%kafka.mp.messaging.incoming.pim-products.topic=pim-products
%kafka.mp.messaging.incoming.pim-products.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
%kafka.mp.messaging.incoming.pim-products.auto.offset.reset=earliest
%kafka.kafka.bootstrap.servers=localhost:9092
quarkus.kafka.devservices.enabled=false

# --- OpenTelemetry tracing ---
# Disabled in dev and test to avoid requiring a running collector.
# In production, point OTEL_ENDPOINT to your Jaeger/Tempo OTLP endpoint.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true
quarkus.otel.exporter.otlp.endpoint=${OTEL_ENDPOINT:http://localhost:4317}
quarkus.otel.resource.attributes=service.name=rag-service,service.version=1.0.0

# --- Metrics ---
# /q/metrics endpoint is auto-enabled by quarkus-micrometer-registry-prometheus.
# Prometheus scrapes it; see prometheus/prometheus.yml.
quarkus.micrometer.export.prometheus.path=/q/metrics

# --- Structured logging ---
# Plain text in dev, JSON in production (for ELK/Loki/Datadog ingestion).
%prod.quarkus.log.console.json=true
quarkus.log.category."io.streamx.rag".level=DEBUG
quarkus.log.category."dev.langchain4j".level=INFO
