# Test configuration -- uses Quarkus DevServices to auto-provision PostgreSQL+pgvector
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.image-name=pgvector/pgvector:pg17

quarkus.langchain4j.openai.api-key=test-key
quarkus.langchain4j.openai.base-url=http://localhost:${quarkus.wiremock.devservices.port:11434}/v1

quarkus.langchain4j.pgvector.dimension=1536

rag.aem.base-url=http://localhost:4502
rag.pim.base-url=http://localhost:8090

# Disable scheduled ingestion in tests
quarkus.scheduler.enabled=false
