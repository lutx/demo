# StreamX RAG Service — Nginx reverse proxy
#
# HTTP-only by default (suitable for LAN / behind a load balancer).
# To enable HTTPS, uncomment the SSL server block and provide certificates.

events {
    worker_connections 1024;
}

http {
    # Gzip compression for API responses
    gzip on;
    gzip_types application/json text/event-stream text/plain;
    gzip_min_length 1024;

    upstream rag_api {
        server rag-service:8081;
    }

    upstream chat_ui {
        server ui:3000;
    }

    # ── Rate limiting zones (shared across workers) ────────────────────────────
    # 10 requests/second per IP for the chat endpoint (burst of 20)
    limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=10r/s;
    # 2 requests/second per IP for admin endpoints
    limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=2r/s;
    # 20 requests/second for the AEM push webhook (AEM can bulk-publish many pages at once)
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=20r/s;

    # ── HTTP server ────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Content-Type-Options  "nosniff"        always;
        add_header X-Frame-Options         "DENY"           always;
        add_header X-XSS-Protection        "1; mode=block"  always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

        # Health check shortcut
        location /health {
            proxy_pass http://rag_api/q/health;
        }

        # Prometheus metrics (restrict to internal network in production)
        location /metrics {
            proxy_pass http://rag_api/q/metrics;
            # allow 10.0.0.0/8;
            # deny all;
        }

        # Admin endpoints — rate limited, require X-Admin-Key (enforced in app)
        location /api/admin/ {
            limit_req zone=admin_limit burst=5 nodelay;
            proxy_pass http://rag_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Full sync + OpenAI embeddings can take several minutes for large catalogs.
            # Override Nginx default (60s) to prevent premature gateway timeout.
            proxy_read_timeout 300s;
        }

        # Chat SSE endpoint — rate limited, SSE-friendly proxy settings
        location /api/chat {
            limit_req zone=chat_limit burst=20 nodelay;
            proxy_pass http://rag_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE: disable buffering so tokens stream in real time
            proxy_http_version 1.1;
            proxy_set_header Connection        '';
            proxy_buffering                    off;
            proxy_cache                        off;
            chunked_transfer_encoding          on;
            proxy_read_timeout                 120s;
        }

        # AEM push webhook — rate limited, auth validated inside the app
        location /api/webhook/ {
            limit_req zone=webhook_limit burst=50 nodelay;
            proxy_pass http://rag_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # All other API calls
        location /api/ {
            proxy_pass http://rag_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Chat widget demo UI
        location / {
            proxy_pass http://chat_ui;
            proxy_set_header Host $host;
        }
    }

    # ── HTTPS server (uncomment and provide certs for production) ─────────────
    # server {
    #     listen 443 ssl http2;
    #     server_name your.domain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/server.crt;
    #     ssl_certificate_key /etc/nginx/certs/server.key;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     # (same location blocks as above)
    # }
    #
    # # HTTP → HTTPS redirect
    # server {
    #     listen 80;
    #     return 301 https://$host$request_uri;
    # }
}
